<!DOCTYPE html>
<html>
<head>
    <title>Test Mercado Pago - Arcatierra</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin: 20px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #B15543; color: white; padding: 15px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #9a4a3a; }
        .loading { opacity: 0.6; pointer-events: none; }
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .success { background: #efe; color: #373; padding: 10px; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🚀 Test Directo Mercado Pago - Arcatierra</h1>
    <p>Esta página prueba directamente el backend sin pasar por el frontend problemático:</p>

    <form id="testForm">
        <div class="form-group">
            <label>Producto:</label>
            <select id="product">
                <option value="1885">CANASTA INDIVIDUAL SUSCRIPCIÓN - $290</option>
                <option value="1886">CANASTA MEDIA SUSCRIPCION - $540</option>
                <option value="1887">CANASTA COMPLETA SUSCRIPCION - $780</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cantidad:</label>
            <input type="number" id="quantity" value="1" min="1" max="10">
        </div>

        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="name" value="Test User" required>
        </div>

        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="test@example.com" required>
        </div>

        <div class="form-group">
            <label>Teléfono:</label>
            <input type="tel" id="phone" value="5551234567" required>
        </div>

        <button type="submit" id="submitBtn">🛒 Crear Pago con Mercado Pago</button>
    </form>

    <div id="result"></div>

    <script>
    document.getElementById('testForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        
        submitBtn.textContent = '⏳ Procesando...';
        submitBtn.classList.add('loading');
        result.innerHTML = '';

        try {
            // Step 1: Create guest user
            console.log('Creating guest user...');
            const userData = {
                email: document.getElementById('email').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value
            };

            const userResponse = await fetch('https://api.dabychos.com/api/usuarios/guest', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (!userResponse.ok) {
                throw new Error('Error creando usuario: ' + userResponse.status);
            }

            const userResult = await userResponse.json();
            console.log('User created:', userResult);

            // Step 2: Create payment preference
            console.log('Creating payment preference...');
            const paymentData = {
                items: [{
                    id: document.getElementById('product').value,
                    quantity: parseInt(document.getElementById('quantity').value)
                }],
                usuario_id: userResult.user_id
            };

            const paymentResponse = await fetch('https://api.dabychos.com/api/crear-preferencia-pago', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });

            if (!paymentResponse.ok) {
                throw new Error('Error creando preferencia: ' + paymentResponse.status);
            }

            const paymentResult = await paymentResponse.json();
            console.log('Payment preference created:', paymentResult);

            // Step 3: Redirect to Mercado Pago
            if (paymentResult.preference_id) {
                const mpUrl = `https://www.mercadopago.com.mx/checkout/v1/redirect?pref_id=${paymentResult.preference_id}`;
                result.innerHTML = `
                    <div class="success">
                        <h3>✅ ¡Éxito!</h3>
                        <p><strong>Usuario ID:</strong> ${userResult.user_id}</p>
                        <p><strong>Preferencia ID:</strong> ${paymentResult.preference_id}</p>
                        <p>Redirigiendo a Mercado Pago en 3 segundos...</p>
                        <p><a href="${mpUrl}" target="_blank">O haz clic aquí para ir manualmente</a></p>
                    </div>
                `;
                
                setTimeout(() => {
                    window.location.href = mpUrl;
                }, 3000);
            }

        } catch (error) {
            console.error('Error:', error);
            result.innerHTML = `
                <div class="error">
                    <h3>❌ Error</h3>
                    <p>${error.message}</p>
                    <p>Revisa la consola del navegador para más detalles.</p>
                </div>
            `;
        } finally {
            submitBtn.textContent = '🛒 Crear Pago con Mercado Pago';
            submitBtn.classList.remove('loading');
        }
    });
    </script>
</body>
</html>
